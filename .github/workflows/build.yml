name: Build PonWrt (an7581)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
        default: build-1
      prerelease:
        description: Mark as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.tag }}

jobs:
  build:
    name: Build an7581
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure an7581
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build
        run: make -j"$(nproc)"

      - name: Pack an7581
        run: |
          mkdir release
          tar --zstd -cf release/ponwrt-an7581.tar.zst \
            -C bin/targets/airoha an7581
          cd release && sha256sum *.tar.zst > sha256sums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Create release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${{ inputs.tag }}"
            release/ponwrt-an7581.tar.zst release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt ${{ inputs.tag }}"
            --generate-notes
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
